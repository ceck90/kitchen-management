server {
    listen ${NGINX_PORT};
    listen [::]:${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /assets/runtime-config.js {
        alias /var/lib/kitchen-management/runtime-config.js;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}