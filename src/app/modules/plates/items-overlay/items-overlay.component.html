<section>
  @if (!hideCloseButton) {
    <p-button (click)="onClose.emit()"
      styleClass="p-button-rounded p-button-info exit-button"
      icon="pi pi-times"
      type="button"
    ></p-button>
  }
  @if (items.length > 0) {
    <p>Ordini in Attesa</p>
  }
  <div class="items-overlay__rows-container">
    @for (i of items; track i) {
      <item-overlay-row [item]="i"
        [plateList]="plateList"
        [enableActions]="enableActions"
        (onRun)="onRun.emit($event)"
        (onActionEvent)="onActionEvent.emit($event)"
      ></item-overlay-row>
    }
  </div>
  @if (items.length == 0) {
    <div class="items-overlay__empty-container">
      <i class="pi pi-book"></i>
      <h3>{{i18n.PLATE.OVERLAY.EMPTY}}</h3>
    </div>
  }
</section>
