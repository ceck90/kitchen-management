<div class="items-overlay__row">
  <span class="item_title">{{item.menuItem?.name}}</span>
  <span class="item_order">ORDINE {{item.orderNumber}}</span>
  @if (enableActions) {
    <p-button (click)="onRun.emit(item)"
      styleClass="play-button p-button-success"
      icon="pi pi-play play-button"
      [showDelay]="500"
    pTooltip="Avvia"></p-button>
    <p-button (click)="toggleOverlay()"
      styleClass="p-button-rounded p-button-text"
      icon="pi pi-ellipsis-v"></p-button>
    @if (deleteOverlay) {
      <ng-container [ngTemplateOutlet]="overlay"></ng-container>
    }
  }

  <ng-template #overlay>
    <div class="delete-options__container">
      @if (!showPlateList) {
        @for (opt of actionOptions; track opt) {
          <span (click)="opt.command!({})">
            <i [class]="opt.icon"></i>
            <label>{{opt.label}}</label>
          </span>
        }
      }
      @if (showPlateList) {
        @for (p of plateList; track p) {
          <span (click)="onPlateMoved(p)">
            <label>{{p.name}}</label>
          </span>
        }
      }
    </div>
  </ng-template>
</div>
